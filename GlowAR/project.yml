name: GlowAR
options:
  bundleIdPrefix: app.glowar
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  GlowAR:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: GlowAR
        PRODUCT_BUNDLE_IDENTIFIER: app.glowar.makeup.x7k2
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Glow AR"
        INFOPLIST_KEY_NSCameraUsageDescription: "Η κάμερα χρειάζεται για να δοκιμάζεις μακιγιάζ σε πραγματικό χρόνο."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Για να αποθηκεύονται οι φωτογραφίες σου με το μακιγιάζ."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
