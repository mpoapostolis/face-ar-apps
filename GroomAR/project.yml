name: GroomAR
options:
  bundleIdPrefix: app.groomar
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  GroomAR:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: GroomAR
        PRODUCT_BUNDLE_IDENTIFIER: app.groomar.men.x7k2
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Groom AR"
        INFOPLIST_KEY_NSCameraUsageDescription: "Η κάμερα χρειάζεται για να δείχνει τους οδηγούς για γένια και φρύδια πάνω στο πρόσωπό σου."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Για να αποθηκεύονται οι φωτογραφίες σου με τους οδηγούς."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
